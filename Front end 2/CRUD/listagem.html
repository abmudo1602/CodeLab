<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Contatos</title>
    <style>
        :root {
            --fundo: #FAF8F5;
            --secundaria: #3B5998;
            --texto: #F7DFD0;
            --acao: #E87A48;
            --texto-escuro: #2C3E50;
            --borda: #E2DDD5;
        }

        * {
            margin: 0;
            padding: 0;
            border: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--fundo);
            color: var(--texto-escuro);
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        /* Container Principal */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--borda);
        }

        /* Cabeçalho */
        .cabecalho {
            background-color: var(--secundaria);
            color: var(--texto);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .titulo {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Botões */
        .btn {
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primario {
            background-color: var(--acao);
            color: #FFFFFF;
        }

        .btn-primario:hover {
            background-color: #d66837;
            transform: translateY(-1px);
        }

        .btn-secundario {
            background-color: #E2DDD5;
            color: var(--texto-escuro);
        }

        .btn-secundario:hover {
            background-color: #d1cbc1;
        }

        /* Tabela */
        .tabela-wrapper {
            padding: 1.5rem 2rem;
            overflow-x: auto;
        }

        .mesa {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .mesa th {
            padding: 0.85rem 1rem;
            border-bottom: 2px solid var(--secundaria);
            color: var(--secundaria);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .mesa td {
            padding: 1rem;
            border-bottom: 1px solid var(--borda);
            color: var(--texto-escuro);
        }

        .mesa tbody tr:hover {
            background-color: var(--fundo);
        }

        /* Botões internos que o app.js pode gerar na coluna Ações */
        .mesa td button {
            padding: 0.4rem 0.75rem;
            margin-right: 0.4rem;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            background-color: var(--secundaria);
            color: var(--texto);
            transition: opacity 0.2s;
        }

        .mesa td button:hover {
            opacity: 0.85;
        }

        /* Sidebar / Modal Lateral */
        .sideBar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5); /* Fundo escurecido */
            z-index: 1000;
            justify-content: flex-end;
        }

        /* Caso o JS mude display para 'block', mantemos o posicionamento */
        .sidebar-conteudo {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 380px;
            height: 100vh;
            background-color: var(--fundo);
            padding: 2rem;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar-titulo {
            color: var(--secundaria);
            font-size: 1.35rem;
            border-bottom: 2px solid var(--acao);
            padding-bottom: 0.5rem;
        }

        /* Formulário */
        .form-grupo {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .campo {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #CCC6BC;
            border-radius: 6px;
            background-color: #FFFFFF;
            font-size: 0.95rem;
            color: var(--texto-escuro);
            transition: border-color 0.2s;
        }

        .campo:focus {
            outline: none;
            border-color: var(--secundaria);
            box-shadow: 0 0 0 3px rgba(59, 89, 152, 0.15);
        }

        .sidebar-acoes {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .sidebar-acoes .btn {
            flex: 1;
        }

        .mensagem-erro {
            color: #C0392B;
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

    <main class="container">
        
        <header class="cabecalho">
            <h1 class="titulo">Meus Contatos</h1>
            <button class="btn btn-primario" onclick="mostrarFormulario()">Adicionar Novo Contato</button>
        </header>

        <section class="tabela-wrapper">
            <table class="mesa">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </section>

    </main>

    <aside class="sideBar" id="sidebar" style="display: none;">
        <div class="sidebar-conteudo">
            <h2 class="sidebar-titulo" id="tituloForm">Novo Contato</h2>
            
            <div class="form-grupo">
                <input class="campo" id="nome" placeholder="Nome">
                <input class="campo" id="telefone" placeholder="Telefone">
                <input class="campo" id="email" placeholder="E-mail">
                <input class="campo" id="cidade" placeholder="Cidade">
            </div>

            <div class="sidebar-acoes">
                <button class="btn btn-primario" id="butaoSalvar" onclick="salvarContato()">Salvar</button>
                <button class="btn btn-secundario" onclick="esconderFormulario()">Cancelar</button>
            </div>

            <p class="mensagem-erro" id="saida"></p>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
