<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="../CSS/formulario.css">
</head>
<body>
    <form class="formulario">
        <h1 class="titulo">Formulário</h1>

        <div class="nome">
            <label for="nome">Nome: </label>
            <input type="text" id="nome" />
            <span class="spanNome" id="spanNome"></span>
        </div>

        <br>

        <div class="idade">
            <label for="idade">Idade:</label>
            <input type="number" id="idade" />
            <span class="spanIdade" id="spanIdade"></span>
        </div>

        <br>

        <div class="email">
            <label for="email">Email: </label>
            <input type="email" id="email" />
            <span class="spanEmail" id="spanEmail"></span>
        </div>

        <div class="caixa">
            <button class="botao" type="button" id="butaoConfirmar">Confirmar </button>
        </div>
    </form>

    <p class="saida" id="saidaTeste">Aguardando seus dados</p>

    <script src="../JS/formulario.js"></script>
</body>
</html>
