<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="../Calculadora/calculadora.css">
</head>
<body>
    <form class="formulario">
        <h1 class="titulo">Calculadora</h1>

       <div class="soma1">
            <label class="texto1" for="numero">Primeiro número: </label>
            <input type="Number" id="numero1" />
            <span class="spanNumero1" id="spanNumero1"></span>
       </div>

        <div class="soma2">
            <label class="texto2" for="numero">Segundo número: </label>
            <input type="Number" id="numero2" />
            <span class="spanNumero2" id="spanNumero2"></span>
       </div>

       <div class="caixa">
        <button class="botao" type="button" id="butaoConfirmar">+</button>
        <button class="botao2" type="button" id="butaoConfirmar2">-</button>
        <button class="botao3" type="button" id="butaoConfirmar3">X</button>
        <button class="botao4" type="button" id="butaoConfirmar4">÷</button>
       </div>
</form>

    <script src="../Calculadora/calculadora.js"></script>
</body>
</html>
