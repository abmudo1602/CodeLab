<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de cadastro</title>

    <link rel="stylesheet" href="../Cadastro/cadastro.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

</head>

<body>

    <div class="x">
        <h1 class="titulo">Cadastro de usuários</h1>
    </div>

    <div class="pai">

        <div class="formulario">

            <form class="cadastro">

                <div class="nome">

                    <label class="spanNome" for="inputNome">
                        Nome
                    </label>

                    <br>

                    <input
                        id="inputNome"
                        placeholder="Digite o seu nome"
                        type="text"
                        enterkeyhint="next"
                    >

                </div>

                <div class="email">

                    <label class="spanEmail" for="inputEmail">
                        Email
                    </label>

                    <br>

                    <input
                        id="inputEmail"
                        placeholder="Digite o seu email"
                        type="email"
                        enterkeyhint="send"
                    >

                </div>

                <div class="caixa">

                    <button
                        class="butao"
                        type="submit"
                        id="butaoCadastrar"
                    >
                        Cadastrar
                    </button>

                </div>

            </form>

        </div>

        <div class="lista">

            <h2 class="Lista-titulo">Lista de usuários</h2>

            <ul class="listagem" id="listaMinha">

            </ul>

        </div>

    </div>

    <script src="../Cadastro/cadastro.js"></script>

</body>

</html>
