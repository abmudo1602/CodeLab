<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de album do spotify</title>
    <link href="estilo/spotify.css" rel="stylesheet">
</head>
<body>
    <img class="capa-album" src="imagens/daniel.jpeg" alt="Capa do álbum">
    
    <header class="titulo">Who knows</header>
    
    <div class="informacoes">
        <img class="foto-perfil" src="imagens/abner.jpg" alt="Foto de perfil">
        <h4 class="nome-perfil">Abner Levi</h4>
    </div>
    
    <h5 class="tempo">1h 7m</h5>
        
    <div class="botao">
        <div class="acoes-esquerda">
            <button class="botao-enriquecer">Enriquecer</button>
            <div class="botoes">
                <img class="download" src="imagens/downloadBranco.png" alt="Baixar músicas">
                <img class="adicionar-pessoas" src="imagens/adicionarBranco.png" alt="Adicionar pessoas">
                <img class="reticencias" src="imagens/reticenciasBranca.png" alt="Reticências">
            </div>
        </div>
        <img class="play" src="imagens/play.png" alt="Play">
    </div>

    <div class="lista-musicas">
        <img class="adicionar-musica" src="imagens/positivo2.jpg" alt="Adicionar música">
        <h4 class="adicionar">Adicione músicas</h4>
    </div>

    <div class="musica1">
        <img src="imagens/daniel.jpeg" alt="Root of all Evil">
        <h4>Roots of all Evil</h4>
        <img class="info1" src="imagens/reticenciasBranca.png" alt="informacoes">
    </div>

    <div class="musica2">
        <img class="sign" src="imagens/daniel.jpeg" alt="Sign Of The Times">
        <h4>Sign Of The Times</h4>
        <img class="info" src="imagens/reticenciasBranca.png" alt="informacoes">
    </div>
</body>
</html>
